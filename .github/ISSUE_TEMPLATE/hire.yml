name: Hire me for a one-page website
description: $400 flat, live in 7 days, for US service businesses.
title: "[hire] "
labels: [hire]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out. **This issue is public**, so share only what is already public
        about your business. No phone numbers, emails or addresses here. I'll reply in this
        issue and we can move to a private channel from there.
  - type: input
    id: business
    attributes:
      label: Business name and type
      placeholder: Example Lawn Care, landscaping
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: City and state you serve
      placeholder: Austin, TX
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Current website or Google Business Profile link, if any
  - type: textarea
    id: goal
    attributes:
      label: What should the page get people to do?
      placeholder: Call for a quote, book online, fill a form...

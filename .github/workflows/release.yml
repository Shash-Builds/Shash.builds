# Push a tag and this publishes a GitHub Release with notes and downloads.
#   skills-v1.2.0     all claude.ai skill zips (built by scripts/build_skill_zip.py)
#   <tool>-v1.0.0     a zip of tools/<tool>/
# Notes come from .github/releases/<tag>.md (start from templates/release/NOTES.md).
name: release
on:
  push:
    tags: ["*-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=".github/releases/${TAG}.md"
          [ -f "$notes" ] || { echo "Missing $notes"; exit 1; }
          name="${TAG%-v*}"
          assets=()
          if [ "$name" = "skills" ]; then
            python3 scripts/build_skill_zip.py
            assets+=(dist/*-skill.zip dist/master-full.md)
          elif [ -d "tools/$name" ]; then
            (cd tools && zip -rq "../${name}.zip" "$name")
            assets+=("${name}.zip")
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" "${assets[@]}"

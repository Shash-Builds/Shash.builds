<!doctype html><html><head><meta charset="utf-8">
<!-- Portfolio trailer v2, 9:16, 20 s at 110 BPM: quiet break at beat 16, the drop at beat 24.
     Hook in the first second, a cut on every beat, the drop cut every half beat. Everything is computed from t.
     Music, fonts and the caps/ screenshots are not included. -->
<style>
@font-face { font-family: "Brico"; src: url("caps/fonts/BricolageGrotesque-Bold.ttf"); font-weight: 800; }
:root { --orange: #e8572c; --ink: #15120f; --cream: #f6efe3; --ink2: #2a2520; --shade: rgba(0,0,0,.55); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--orange); font-family: "Inter", sans-serif; }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
#flash, #fade { position: absolute; inset: 0; pointer-events: none; }
#flash { background: #fffaf0; opacity: 0; } #fade { background: #000; opacity: 0; }
.disp { font-family: "Brico", sans-serif; font-weight: 800; letter-spacing: -0.05em; line-height: .86; }
.abs { position: absolute; left: 0; right: 0; text-align: center; }
.stage { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 50% 45%; }
.win { position: absolute; border-radius: 22px; overflow: hidden; background: var(--ink); box-shadow: 0 60px 120px -30px var(--shade); }
.win .bar { height: 32px; background: var(--ink2); display: flex; gap: 10px; align-items: center; padding: 0 16px; }
.win .bar i { width: 12px; height: 12px; border-radius: 50%; background: #4a423a; }
.win .scr { overflow: hidden; position: relative; }
.win img { display: block; width: 100%; }
.mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em; }
.mask > span { display: inline-block; }
.chip { display: inline-block; padding: 18px 34px; border-radius: 999px; font: 600 40px/1 "Inter", sans-serif; }
.pill { display: inline-block; padding: 26px 54px; border-radius: 999px; background: var(--ink); color: var(--cream); font: 600 46px/1 "Inter", sans-serif; }
</style></head><body>
<div id="cam"></div><div id="flash"></div><div id="fade"></div>
<script>
const BEAT = 60 / 110, NB = 38; window.DURATION = NB * BEAT;
const C = { o: '#e8572c', k: '#15120f', c: '#f6efe3' };
const SITES = ['Swiss grid', 'Night glow', 'Organic', 'Playful', 'Glass', 'Editorial', 'Brutal', 'Luxe'];
const img = n => `caps/s${n}.jpg`;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, p) => a + (b - a) * p;
const out = x => 1 - Math.pow(1 - cl(x), 3), inn = x => Math.pow(cl(x), 3), io = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const spring = x => { x = cl(x); return 1 - Math.exp(-6 * x) * Math.cos(9 * x); };
const pre = [...Array(8)].map((_, i) => img(i + 1)).concat(['caps/tab.png', 'caps/lb1.jpg', 'caps/lb2.jpg', 'caps/lb3.jpg', 'caps/skill.jpg']);
window.READY = Promise.all([document.fonts.load('800 100px "Brico"'), ...pre.map(s => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = s; }))]);
const win = (src, w, css, scroll = 0) => `<div class="win" style="width:${w}px;${css}"><div class="bar"><i></i><i></i><i></i></div><div class="scr"><img src="${src}" style="transform:translateY(${-scroll}px)"></div></div>`;
// a word revealed through a mask: p 0..1
const reveal = (txt, p, color) => `<span class="mask"><span style="transform:translateY(${(1 - out(p)) * 105}%);color:${color}">${txt}</span></span>`;
const cam = document.getElementById('cam');

window.renderFrame = t => {
  const b = t / BEAT; let bg = C.o, h = '', shake = 0, camT = '';
  if (b < 8) {
    // A. hook: BOOKED. slams, Tab rises, three sites fly in on beats 1, 2, 3
    const k = out(b / .5), drift = b * 6;
    h += `<div class="abs disp" style="top:330px;font-size:236px;color:${C.c};clip-path:inset(${(1 - k) * 100}% 0 0 0);transform:scale(${mix(1.35, 1, k) + b * .006})">BOOKED.</div>`;
    const fly = [[1, -330, 560, 34, -8, 1], [2, 340, 760, 30, 10, 2], [3, -300, 1120, -24, -6, 3]];
    h += '<div class="stage">' + fly.map(([at, x, y, ry, rz, n]) => { const p = out((b - at) / .7); if (b < at) return '';
      return win(img(n), 560, `left:${270 + x}px;top:${y}px;opacity:${cl(p * 2)};transform:translateZ(${mix(-1400, -260, p) + drift * 4}px) rotateY(${ry}deg) rotateZ(${rz}deg);filter:blur(${(1 - p) * 10}px)`, b * 8); }).join('') + '</div>';
    const r = out(b / .9);
    h += `<img src="caps/tab.png" style="position:absolute;left:50%;top:${mix(1300, 470, r)}px;width:820px;transform:translateX(-50%) scale(${1 + b * .01})">`;
    const band = out((b - 3.8) / .45);
    h += `<div style="position:absolute;left:0;right:0;bottom:0;height:500px;background:${C.k};transform:translateY(${(1 - band) * 520}px)"></div>`;
    h += `<div class="abs disp" style="top:1500px;font-size:132px">${reveal('$400', (b - 4) / .5, C.c)} ${reveal('websites', (b - 4.25) / .5, C.c)}</div>`;
    h += `<div class="abs disp" style="top:1650px;font-size:108px">${reveal('that get you', (b - 6) / .5, C.c)} ${reveal('booked.', (b - 6.3) / .5, C.o)}</div>`;
    const w = inn((b - 7.6) / .4); camT = `translateY(${-w * 1920}px)`; cam.style.filter = `blur(${w * 18}px)`;
    if (b < .25) shake = (1 - b / .25) * 16;
  } else if (b < 16) {
    // B. the work: one big tilted window, a new style on every beat, wiped in, with the camera drifting
    bg = C.k; const i = Math.min(7, Math.floor(b - 8)), lb = b - 8 - i, dir = i % 2 ? 1 : -1;
    const w0 = out((b - 8) / .35); cam.style.filter = `blur(${(1 - w0) * 18}px)`; camT = `translateY(${(1 - w0) * 1920}px)`;
    h += `<div class="abs disp" style="top:170px;font-size:150px;color:${C.c}">${reveal('8 styles.', (b - 8.1) / .5, C.c)}</div>`;
    h += `<div class="abs" style="top:360px"><span class="chip" style="background:${C.o};color:${C.k}">S-0${i + 1}&nbsp;&nbsp;${SITES[i]}</span></div>`;
    const ry = mix(-16, 12, (b - 8) / 8), rx = 10, z = mix(-120, 60, (b - 8) / 8);
    const ghost = j => j >= 0 && j < 8 ? win(img(j + 1), 900, `left:90px;top:640px;opacity:.28;filter:blur(6px);transform:translateZ(-700px) translateX(${(j - i) * 520}px) rotateX(${rx}deg) rotateY(${ry}deg)`) : '';
    const wipe = out(lb / .32);
    h += `<div class="stage">${ghost(i - 1)}${ghost(i + 1)}
      ${i > 0 ? win(img(i), 980, `left:50px;top:640px;transform:translateZ(${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`, (b - 8) * 14) : ''}
      ${win(img(i + 1), 980, `left:50px;top:640px;clip-path:inset(0 ${dir > 0 ? (1 - wipe) * 100 : 0}% 0 ${dir < 0 ? (1 - wipe) * 100 : 0}%);transform:translateZ(${z}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${mix(1.06, 1, wipe)})`, (b - 8) * 14)}</div>`;
    h += `<div class="abs" style="top:1560px;font:600 44px/1.3 Inter;color:${C.c};opacity:.8">0${i + 1} / 08</div>`;
    h += `<div class="abs" style="top:1720px;height:8px;left:120px;right:120px;background:#3a332c;border-radius:8px"><div style="height:8px;width:${(b - 8) / 8 * 100}%;background:${C.o};border-radius:8px"></div></div>`;
  } else if (b < 24) {
    // C. the quiet break: the lookbook, camera easing into the controls, three lines; then a speed ramp into the drop
    bg = C.c; const j = Math.min(2, Math.floor((b - 16) / 2.5));
    const ramp = inn((b - 22.6) / 1.4), zoom = mix(1, 1.35, io((b - 16) / 6.6)) * (1 + ramp * 5);
    h += `<div class="abs disp" style="top:200px;font-size:150px;line-height:.95">
      <div>${reveal('Your name.', (b - 16.2) / .5, C.k)}</div><div>${reveal('Your photos.', (b - 18.2) / .5, C.k)}</div><div>${reveal('Your site.', (b - 20.2) / .5, C.o)}</div></div>`;
    h += `<div class="stage"><div style="position:absolute;left:40px;top:860px;width:1000px;transform-origin:22% 40%;transform:scale(${zoom}) rotateX(${mix(8, 0, (b - 16) / 6)}deg)">
      ${win(`caps/lb${j + 1}.jpg`, 1000, 'position:relative;')}</div></div>`;
    h += `<div class="abs" style="top:1650px;font:500 44px/1.3 Inter;color:${C.k};opacity:${out((b - 20.8) / .6) * (1 - ramp)}">Try any look on your own business.</div>`;
    cam.style.filter = `blur(${ramp * 10}px)`;
  } else if (b < 32) {
    // D. the drop: half-beat cuts. On the beat a fact slams in; on the off-beat a wall of all 8 sites flies past
    const i = Math.floor(b - 24), half = (b - 24) % 1, on = half < .5, lh = on ? half / .5 : (half - .5) / .5;
    const FACTS = [['$400', 'flat price'], ['7 days', 'to go live'], ['2 rounds', 'of changes'], ['Booking', 'built in'], ['Yours', 'to keep'], ['Your hours', 'Mon to Fri']];
    const pal = [[C.k, C.o, C.c], [C.o, C.k, C.c], [C.c, C.k, C.o]][i % 3];
    if (i >= 6) {
      // free Claude skill: the card spins in on beat 30 and holds
      bg = C.k; const p = spring((b - 30) / 1.2);
      h += `<div class="abs disp" style="top:330px;font-size:150px;color:${C.c}">${reveal('Free', (b - 30) / .4, C.c)} ${reveal('Claude', (b - 30.15) / .4, C.o)}<br>${reveal('skill.', (b - 30.3) / .4, C.c)}</div>`;
      h += `<div class="stage"><div style="position:absolute;left:90px;top:860px;width:900px;border-radius:26px;overflow:hidden;box-shadow:0 60px 120px -20px var(--shade);transform:translateZ(${mix(-900, 0, p)}px) rotateY(${mix(-70, -6, p)}deg) rotateX(${mix(20, 6, p)}deg)"><img src="caps/skill.jpg" style="width:100%;display:block"></div></div>`;
      h += `<div class="abs" style="top:1580px;font:500 44px/1.3 Inter;color:${C.c};opacity:${out((b - 30.8) / .5)}">“Booked one-pager” for Claude</div>`;
    } else if (on) {
      bg = pal[0]; const p = spring(lh / .8);
      const fs = Math.min(300, Math.floor(1700 / FACTS[i][0].length));
      h += `<div class="abs disp" style="top:${900 - fs * .5}px;font-size:${fs}px;color:${pal[1]};transform:scale(${mix(1.6, 1, p)}) rotate(${mix(i % 2 ? 4 : -4, 0, p)}deg)">${FACTS[i][0]}</div>`;
      h += `<div class="abs" style="top:1080px;font:600 60px/1 Inter;color:${pal[2]};opacity:${out((lh - .2) / .3)}">${FACTS[i][1]}</div>`;
      if (lh < .3) shake = (1 - lh / .3) * 22;
    } else {
      bg = pal[2]; const dx = (i % 2 ? -1 : 1) * mix(-900, 900, lh);
      h += `<div class="stage" style="perspective:1200px"><div style="position:absolute;left:-420px;top:380px;width:1920px;display:grid;grid-template-columns:repeat(4,1fr);gap:40px;transform:translateX(${dx}px) rotateX(48deg) rotateZ(${i % 2 ? 18 : -18}deg) scale(1.6)">
        ${[1, 2, 3, 4, 5, 6, 7, 8].map(n => `<div class="win" style="position:relative"><div class="scr"><img src="${img(n)}"></div></div>`).join('')}</div></div>`;
      cam.style.filter = `blur(${Math.sin(lh * Math.PI) * 6}px)`;
    }
    if (on || i >= 6) cam.style.filter = 'none';
    if (b < 24.2) $flash(1 - (b - 24) / .2);
  } else {
    // E. end card (same lines as scene.html)
    bg = C.o; cam.style.filter = 'none';
    const k = out((b - 32) / .8);
    h += `<img src="caps/tab.png" style="position:absolute;left:50%;top:${mix(1000, 300, out((b - 32) / 1.1))}px;width:760px;opacity:${k};transform:translateX(-50%) scale(.78)">`;
    const a = out((b - 32.4) / .6), bt = spring((b - 33.2) / .9), u = out((b - 35) / .6);
    h += `<div class="abs" style="top:1060px;background:${C.o};padding-top:40px;min-height:900px">
      <div class="disp" style="font-size:190px;color:${C.k};opacity:${a};transform:translateY(${(1 - a) * 50}px)">Let’s talk.</div>
      <div style="margin-top:56px;opacity:${b >= 33.2 ? 1 : 0};transform:scale(${mix(.6, 1, bt)})"><span class="pill">Book a 15-min call</span></div>
      <div class="disp" style="margin-top:60px;font-size:96px;color:${C.c};opacity:${b >= 34 ? 1 : 0};transform:scale(${mix(.7, 1, spring((b - 34) / .9))})">DM to enquire</div>
      <div style="margin-top:48px;font:500 42px/1 Inter;color:${C.k};opacity:${u}">shashwat-websites.netlify.app</div></div>`;
    if (b < 32.25) $flash((1 - (b - 32) / .25) * .6);
    document.getElementById('fade').style.opacity = inn((b - 36.6) / 1.4);
  }
  if (!(b < 24.2 && b >= 24) && !(b >= 32 && b < 32.25)) $flash(0);
  const sx = shake ? Math.sin(t * 97) * shake : 0, sy = shake ? Math.cos(t * 83) * shake : 0;
  cam.style.background = bg; cam.style.transform = `${camT} translate(${sx}px,${sy}px)`; cam.innerHTML = h;
  document.body.style.background = bg;
};
function $flash(v) { document.getElementById('flash').style.opacity = cl(v); }
window.renderFrame(0);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video review</title>
<style>
  :root { --bg:#02080f; --ink:#d9fbff; --muted:#6fb7c4; --accent:#00e5ff; --line:#0c2a36; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; gap:20px; grid-template-columns:1fr; }
  @media (min-width:900px) { main { grid-template-columns:3fr 2fr; } }
  h1 { font-size:18px; margin:0 0 4px; letter-spacing:.04em; }
  p.hint { color:var(--muted); margin:0 0 12px; font-size:13px; }
  video { width:100%; max-height:70vh; background:#000; border:1px solid var(--line); border-radius:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button, label.file { background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:8px;
    padding:8px 12px; font:inherit; cursor:pointer; }
  button:hover, label.file:hover { background:rgba(0,229,255,.08); }
  button:disabled { opacity:.4; cursor:default; }
  input[type=file] { display:none; }
  textarea { width:100%; min-height:70px; background:#041420; color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:10px; font:inherit; }
  ol { list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px; }
  li { border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; gap:10px; align-items:flex-start; }
  li .t { color:var(--accent); font-variant-numeric:tabular-nums; cursor:pointer; min-width:48px; }
  li .x { margin-left:auto; border:none; color:var(--muted); padding:0 4px; }
  #status { color:var(--muted); font-size:13px; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Video review</h1>
    <p class="hint">Open the video, pause where something should change, then type or speak a note. Each note keeps the exact second. Typed notes stay on this computer; spoken notes go through the browser's speech service.</p>
    <video id="v" controls playsinline></video>
    <div class="row">
      <label class="file">Open video<input id="file" type="file" accept="video/*"></label>
      <button id="back" type="button">Back 2 s</button>
    </div>
  </section>
  <section>
    <textarea id="note" placeholder="What should change at this moment?"></textarea>
    <div class="row">
      <button id="add" type="button">Add note at current time</button>
      <button id="mic" type="button">Speak a note</button>
      <button id="copy" type="button">Copy all notes</button>
    </div>
    <div id="status" role="status"></div>
    <ol id="list"></ol>
  </section>
</main>
<script>
  const v = document.getElementById("v"), note = document.getElementById("note"), list = document.getElementById("list");
  const status = document.getElementById("status");
  let notes = [], name = "video";
  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const key = () => "review-notes:" + name;
  const save = () => { try { localStorage.setItem(key(), JSON.stringify(notes)); } catch (e) {} };
  function load() { try { notes = JSON.parse(localStorage.getItem(key()) || "[]"); } catch (e) { notes = []; } render(); }
  function render() {
    list.textContent = "";
    notes.sort((a, b) => a.t - b.t).forEach((n, i) => {
      const li = document.createElement("li");
      const t = document.createElement("span"); t.className = "t"; t.textContent = fmt(n.t); t.title = "Jump here";
      t.onclick = () => { v.currentTime = n.t; v.pause(); };
      const tx = document.createElement("span"); tx.textContent = n.text;
      const x = document.createElement("button"); x.className = "x"; x.textContent = "remove"; x.type = "button";
      x.onclick = () => { notes.splice(i, 1); save(); render(); };
      li.append(t, tx, x); list.append(li);
    });
  }
  function add(text, at) {
    text = (text || "").trim(); if (!text) { status.textContent = "Write a note first."; return; }
    notes.push({ t: at, text }); save(); render(); note.value = ""; status.textContent = "Saved at " + fmt(at) + ".";
  }
  document.getElementById("file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    name = f.name; v.src = URL.createObjectURL(f); load(); status.textContent = "Opened " + f.name + ".";
  };
  document.getElementById("back").onclick = () => { v.currentTime = Math.max(0, v.currentTime - 2); };
  note.addEventListener("focus", () => v.pause());
  document.getElementById("add").onclick = () => add(note.value, v.currentTime);
  note.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) add(note.value, v.currentTime); });
  document.getElementById("copy").onclick = async () => {
    const text = name + "\n" + notes.map(n => fmt(n.t) + " - " + n.text).join("\n");
    try { await navigator.clipboard.writeText(text); status.textContent = "Copied " + notes.length + " notes. Paste them to Claude."; }
    catch (e) { note.value = text; note.select(); status.textContent = "Select and copy the text in the box."; }
  };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = document.getElementById("mic");
  if (!SR) { mic.disabled = true; mic.title = "Speech needs Chrome or Edge"; }
  else mic.onclick = () => {
    const at = v.currentTime; v.pause();
    const r = new SR(); r.lang = navigator.language || "en-US"; r.interimResults = false;
    status.textContent = "Listening... speak your note.";
    r.onresult = e => add(e.results[0][0].transcript, at);
    r.onerror = () => { status.textContent = "Could not hear that. Try again or type it."; };
    r.start();
  };
  load();
</script>
</body>
</html>
